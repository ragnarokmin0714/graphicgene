[package]
name = "graphicgene-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RenderScene, Renderer trait and the CPU renderer for graphicgene"

[dependencies]
graphicgene-core.workspace = true
kurbo.workspace = true
# No `png-format`: encoding is the platform's job (see export.rs), and it
# would bring nine crates (png, flate2 and their deflate stack) and 53 KB of
# gzipped wasm.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
thiserror.workspace = true

[dev-dependencies]
graphicgene-core = { workspace = true, features = ["testing"] }
