[workspace]
resolver = "2"
members = [
    "crates/graphicgene-core",
    "crates/graphicgene-render",
    "crates/graphicgene-wasm",
]
# The desktop shell is its own workspace: it needs the system webview's
# libraries to build, which the core, the wasm build and CI's checks must not.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
graphicgene-core = { path = "crates/graphicgene-core" }
graphicgene-render = { path = "crates/graphicgene-render" }
kurbo = { version = "0.13", features = ["serde"] }
slotmap = { version = "1.0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: exact f64 parsing. The default parser can be one ulp off,
# and autosave re-reads the project on every visit, so geometry would drift.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

# Release profile for the WASM build.
# NOTE: opt-level is "s", not "z" — "z" frequently costs real runtime in
# geometry-heavy code. Re-measure before changing it.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
