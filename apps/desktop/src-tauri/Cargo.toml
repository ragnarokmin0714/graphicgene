[package]
name = "graphicgene-desktop"
# Moves with the workspace version in the root Cargo.toml at each release;
# Tauri takes the app's version from here.
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "graphicgene in a desktop window: the web app in a Tauri webview, files on disk"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
