name: Desktop

# Builds the desktop app on Windows, macOS and Linux. A version tag also
# drafts a GitHub release with the installers, for Roger to look over and
# publish; any other run keeps them as workflow artifacts. The web app ships
# from deploy.yml; nothing here touches Pages.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            bundle: nsis
          - os: macos-15
            bundle: dmg
          - os: ubuntu-24.04
            bundle: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # What the system webview needs to build against on Linux. Windows has
      # WebView2 and macOS WebKit built in.
      - name: Install the webview's libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          # The desktop crate is its own workspace, with its own target dir.
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - run: cargo install wasm-pack --locked
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The page the window shows: the web app built at base "/". Tauri
      # embeds it at compile time, so it must exist before clippy runs.
      - run: pnpm build
      - name: Check the desktop crate
        if: runner.os == 'Linux'
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      # Runs the web build again first (beforeBuildCommand); with the wasm
      # already compiled that takes seconds.
      - run: pnpm build:desktop --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v7
        with:
          name: graphicgene-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Draft a release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" installers/*
          --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "graphicgene $GITHUB_REF_NAME"
          --notes "Desktop installers built from $GITHUB_REF_NAME. They are not code-signed:
          Windows SmartScreen and macOS Gatekeeper warn before the first run."
