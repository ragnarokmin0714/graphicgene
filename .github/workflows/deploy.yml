name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Runners are pinned to an Ubuntu release on purpose: `ubuntu-latest` moves to
# a new major on GitHub's schedule, which would change CI with no commit to
# show for it. Moving up is a deliberate one-line change, made once CI has
# passed on the new image — the same rule as any other major version.
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # --all-targets, so lints in test files cannot slip through.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # v1: v0 caches hold a wasm-pack the old action copied into
          # ~/.cargo/bin, which `cargo install` refuses to overwrite.
          prefix-key: v1-rust
      # From crates.io rather than a third-party action (the one used before
      # stopped at Node 16). rust-cache keeps ~/.cargo/bin, so this compiles
      # once and is a no-op until a new wasm-pack is released.
      - run: cargo install wasm-pack --locked
      # No `version:` here on purpose — action-setup reads `packageManager`
      # from package.json, and specifying both fails with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm
      # No browser engine in CI, so these stand in for the app working: the
      # wasm boundary end to end, then the React app driven in jsdom.
      - run: pnpm --filter @graphicgene/web smoke
      - run: pnpm --filter @graphicgene/web ui
      - name: Build web app
        # GitHub Pages serves from /<repo>/, so the base path must match.
        run: pnpm --filter @graphicgene/web build
        env:
          GG_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
